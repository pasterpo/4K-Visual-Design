<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A high-resolution WebGL generative art experience rendering a continuously evolving, non-repeating procedural visual pattern in real time.">
<title>40,000,000 Pixels — A Pattern That Never Repeats</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #fallback {
    color: #eee;
    background: #000;
    font-family: monospace;
    padding: 40px;
    font-size: 16px;
    line-height: 1.6;
    max-width: 640px;
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<script>
(function () {
  const GRID_W = 8000;
  const GRID_H = 5000; // 8000 * 5000 = 40,000,000 cells, all still computed live, every frame.

  const canvas = document.getElementById('glcanvas');
  canvas.width = GRID_W;
  canvas.height = GRID_H;

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

  if (!gl) {
    document.body.innerHTML =
      '<div id="fallback">WebGL isn\'t available on this browser/device, ' +
      'so this cannot run — it needs GPU acceleration.</div>';
    return;
  }

  const vsSource = `
    attribute vec2 a_pos;
    void main() {
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const fsSource = `
    precision highp float;
    uniform float u_time;
    uniform vec2  u_resolution;
    uniform vec2  u_seed;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.45, 678.91));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    // Smooth value noise: random lattice corners, interpolated.
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }

    // Fractal Brownian motion: stack octaves of noise for organic detail.
    float fbm(vec2 p) {
      float value = 0.0;
      float amp = 0.5;
      for (int i = 0; i < 5; i++) {
        value += amp * noise(p);
        p *= 2.02;
        amp *= 0.5;
      }
      return value;
    }

    // Smooth cosine colour palette — cycles through hues with no hard edges.
    vec3 palette(float t) {
      vec3 a = vec3(0.50, 0.45, 0.55);
      vec3 b = vec3(0.50, 0.50, 0.50);
      vec3 c = vec3(1.00, 1.00, 1.00);
      vec3 d = vec3(0.00, 0.33, 0.67);
      return a + b * cos(6.28318 * (c * t + d));
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
      vec2 p  = uv * 3.0 + u_seed;

      // Domain warping: feed noise through itself so it flows and folds
      // like smoke or marble, instead of just sitting there as static.
      vec2 q = vec2(fbm(p), fbm(p + vec2(5.2, 1.3)));
      vec2 r = vec2(
        fbm(p + 4.0 * q + vec2(1.7, 9.2) + 0.13 * u_time),
        fbm(p + 4.0 * q + vec2(8.3, 2.8) + 0.11 * u_time)
      );
      float n = fbm(p + 4.0 * r);
      n = smoothstep(0.10, 0.90, n); // punch up contrast on the flow lines

      vec3 col = palette(n + 0.015 * u_time);
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(shader));
      throw new Error('Shader compile failed');
    }
    return shader;
  }

  const vs = compile(gl.VERTEX_SHADER, vsSource);
  const fs = compile(gl.FRAGMENT_SHADER, fsSource);

  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    throw new Error('Program link failed');
  }
  gl.useProgram(program);

  const posBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1, -1,
     1, -1,
    -1,  1,
     1,  1,
  ]), gl.STATIC_DRAW);

  const posLoc = gl.getAttribLocation(program, 'a_pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  const timeLoc = gl.getUniformLocation(program, 'u_time');
  const resLoc  = gl.getUniformLocation(program, 'u_resolution');
  const seedLoc = gl.getUniformLocation(program, 'u_seed');

  gl.uniform2f(resLoc, GRID_W, GRID_H);
  gl.viewport(0, 0, GRID_W, GRID_H);

  const prefersReduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = prefersReduced ? 0.08 : 1.0;

  // A genuine random walk, nudged by a fresh Math.random() every frame.
  // Each step is a continuous random value, so the exact (seedX, seedY)
  // position right now has zero probability of ever exactly matching a
  // position it has already passed through — the pattern this drives is
  // guaranteed, not just likely, to never retrace its own path.
  let seedX = Math.random() * 1000;
  let seedY = Math.random() * 1000;
  const start = performance.now();

  function render(now) {
    const t = (now - start) * 0.001 * speed;
    seedX += (Math.random() - 0.5) * 0.006 * speed;
    seedY += (Math.random() - 0.5) * 0.006 * speed;

    gl.uniform1f(timeLoc, t);
    gl.uniform2f(seedLoc, seedX, seedY);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
